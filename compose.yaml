name: newnexus

x-control-plane: &control-plane
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    NEWNEXUS_MASTER_KEY: ${NEWNEXUS_MASTER_KEY:?set NEWNEXUS_MASTER_KEY in .env}
    NEWNEXUS_PUBLIC_URL: ${NEWNEXUS_PUBLIC_URL:-http://localhost:8080}
    NEWNEXUS_AGENT_PUBLIC_SERVER: ${NEWNEXUS_AGENT_PUBLIC_SERVER:-localhost:9090}
    NEWNEXUS_HTTP_ADDR: :8080
    NEWNEXUS_GRPC_ADDR: :9090
    NEWNEXUS_SECURE_COOKIES: ${NEWNEXUS_SECURE_COOKIES:-false}
  ports:
    - "${NEWNEXUS_HTTP_PORT:-8080}:8080"
    - "${NEWNEXUS_GRPC_PORT:-9090}:9090"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  control-plane-sqlite:
    <<: *control-plane
    profiles: ["sqlite"]
    environment:
      NEWNEXUS_MASTER_KEY: ${NEWNEXUS_MASTER_KEY:?set NEWNEXUS_MASTER_KEY in .env}
      NEWNEXUS_PUBLIC_URL: ${NEWNEXUS_PUBLIC_URL:-http://localhost:8080}
      NEWNEXUS_AGENT_PUBLIC_SERVER: ${NEWNEXUS_AGENT_PUBLIC_SERVER:-localhost:9090}
      NEWNEXUS_DATABASE_DRIVER: sqlite
      NEWNEXUS_DATABASE_URL: /data/newnexus.db
      NEWNEXUS_HTTP_ADDR: :8080
      NEWNEXUS_GRPC_ADDR: :9090
      NEWNEXUS_SECURE_COOKIES: ${NEWNEXUS_SECURE_COOKIES:-false}
    volumes:
      - newnexus-data:/data

  control-plane-postgres:
    <<: *control-plane
    profiles: ["postgres"]
    environment:
      NEWNEXUS_MASTER_KEY: ${NEWNEXUS_MASTER_KEY:?set NEWNEXUS_MASTER_KEY in .env}
      NEWNEXUS_PUBLIC_URL: ${NEWNEXUS_PUBLIC_URL:-http://localhost:8080}
      NEWNEXUS_AGENT_PUBLIC_SERVER: ${NEWNEXUS_AGENT_PUBLIC_SERVER:-localhost:9090}
      NEWNEXUS_DATABASE_DRIVER: postgres
      NEWNEXUS_DATABASE_URL: postgres://newnexus:${POSTGRES_PASSWORD:-change-me-before-production}@postgres:5432/newnexus?sslmode=disable
      NEWNEXUS_HTTP_ADDR: :8080
      NEWNEXUS_GRPC_ADDR: :9090
      NEWNEXUS_SECURE_COOKIES: ${NEWNEXUS_SECURE_COOKIES:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: newnexus
      POSTGRES_USER: newnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newnexus -d newnexus"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    profiles: ["agent"]
    restart: unless-stopped
    command:
      - --server=${NEWNEXUS_AGENT_SERVER:-control-plane-sqlite:9090}
      - --enroll-code=${NEWNEXUS_AGENT_ENROLL_CODE:-create-code-in-console}
      - --name=${NEWNEXUS_AGENT_NAME:-local-docker-agent}
      - --state=/state/agent-state.json
      - --insecure
    volumes:
      - agent-state:/state

volumes:
  newnexus-data:
  postgres-data:
  agent-state:
