root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/newnexus-dev.exe ./cmd/server"
bin = "tmp/air/newnexus-dev.exe"
delay = 500
exclude_dir = [".git", ".gocache", ".gomodcache", ".gopath", ".playwright-cli", "dist", "output", "tmp", "web"]
exclude_regex = ["_test.go"]
include_ext = ["go", "yaml", "yml"]
kill_delay = "500ms"
log = "tmp/air/build-errors.log"
poll = true
poll_interval = 500
rerun = false
send_interrupt = false
stop_on_error = true

[log]
main_only = false
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
