root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/newnexus-server.exe ./cmd/server"
bin = "./tmp/air/newnexus-server.exe"
delay = 700
include_ext = ["go", "yaml", "yml"]
include_dir = ["cmd", "internal", "api"]
exclude_dir = ["web", "dist", "tmp", ".git", ".gocache", ".gomodcache", ".gopath"]
exclude_regex = ["_test\\.go$"]
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[screen]
clear_on_rebuild = false
keep_scroll = true
