name: newnexus
x-control: &control
  image: ${NEWNEXUS_IMAGE:-newnexus:local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=64m,mode=1777]
  stop_grace_period: 30s
  ports:
    - '${NEWNEXUS_HTTPS_PORT:-8443}:8080'
    - '${NEWNEXUS_GRPC_PORT:-9443}:9090'
  environment: &control-env
    NEWNEXUS_ENV: production
    NEWNEXUS_MASTER_KEY: ${NEWNEXUS_MASTER_KEY:?Set NEWNEXUS_MASTER_KEY in .env}
    NEWNEXUS_SETUP_TOKEN: ${NEWNEXUS_SETUP_TOKEN:-}
    NEWNEXUS_TRUSTED_PROXIES: ${NEWNEXUS_TRUSTED_PROXIES:-}
    NEWNEXUS_TLS_CERT: /tls/fullchain.pem
    NEWNEXUS_TLS_KEY: /tls/privkey.pem
  networks:
    default:
      aliases: [control-plane]
services:
  server-sqlite:
    <<: *control
    profiles: [sqlite]
    volumes:
      - sqlite-data:/data
      - ${NEWNEXUS_TLS_DIR:-./deploy/tls}:/tls:ro
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin
      - --default-time-zone=+00:00
      - --default-storage-engine=InnoDB
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-512M}
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
    environment:
      MYSQL_DATABASE: newnexus
      MYSQL_USER: newnexus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent --skip-column-names']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: [no-new-privileges:true]
  server-mysql:
    <<: *control
    profiles: [mysql]
    environment:
      <<: *control-env
      NEWNEXUS_DATABASE_URL: mysql://newnexus:${MYSQL_PASSWORD}@mysql:3306/newnexus?tls=false
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - control-data:/data
      - ${NEWNEXUS_TLS_DIR:-./deploy/tls}:/tls:ro
  agent:
    image: ${NEWNEXUS_AGENT_IMAGE:-newnexus-agent:local}
    build:
      context: .
      dockerfile: Dockerfile.agent
    profiles: [agent]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m,mode=1777]
    environment:
      NEWNEXUS_AGENT_SERVER: control-plane:9090
      NEWNEXUS_AGENT_TLS_SERVER_NAME: ${NEWNEXUS_TLS_SERVER_NAME:-newnexus.example.com}
      NEWNEXUS_AGENT_CA_FILE: /tls/ca.pem
      NEWNEXUS_AGENT_ENROLLMENT_TOKEN: ${NEWNEXUS_AGENT_ENROLLMENT_TOKEN:-}
      NEWNEXUS_AGENT_NAME: compose-local
      NEWNEXUS_AGENT_ALLOWED_PORTS: ${NEWNEXUS_AGENT_ALLOWED_PORTS:-80,443}
    volumes:
      - agent-data:/data
      - ${NEWNEXUS_TLS_DIR:-./deploy/tls}/fullchain.pem:/tls/ca.pem:ro
volumes:
  sqlite-data:
  control-data:
  mysql-data:
  agent-data:
