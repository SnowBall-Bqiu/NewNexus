name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test Go control plane and Agent
        run: go test ./cmd/... ./internal/...
      - name: Lint and test web console
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run test

  packages:
    name: Package Linux ${{ matrix.architecture }}
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build and assemble deployment package
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_name="newnexus-v${version}-linux-${TARGET_ARCH}"
          package_dir="dist/${package_name}"

          mkdir -p "${package_dir}/web"
          CGO_ENABLED=0 GOOS=linux GOARCH="${TARGET_ARCH}" \
            go build -trimpath -ldflags="-s -w" -o "${package_dir}/newnexus-server" ./cmd/server

          CGO_ENABLED=0 GOOS=linux GOARCH="${TARGET_ARCH}" \
            go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o "${package_dir}/newnexus-agent-linux-${TARGET_ARCH}" ./cmd/agent
          cp "${package_dir}/newnexus-agent-linux-${TARGET_ARCH}" "${package_dir}/newnexus-agent"

          cp -a web/dist "${package_dir}/web/dist"
          cp -a api deploy docs proto README.md LICENSE docker-compose.yaml .env.example "${package_dir}/"
          chmod 0755 "${package_dir}/newnexus-server" "${package_dir}"/newnexus-agent*
          tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.architecture }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release-assets:
    name: Publish release assets
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download deployment packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-linux-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/SHA256SUMS --clobber

  container:
    name: Publish multi-platform container
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate control-plane metadata
        id: control_metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/snowball-bqiu/newnexus
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Build and push control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.control_metadata.outputs.tags }}
          labels: ${{ steps.control_metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate Agent metadata
        id: agent_metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/snowball-bqiu/newnexus-agent
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Build and push Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.agent_metadata.outputs.tags }}
          labels: ${{ steps.agent_metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
