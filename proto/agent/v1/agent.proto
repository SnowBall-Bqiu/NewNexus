syntax = "proto3";
package agent.v1;
option go_package = "github.com/newnexus/newnexus/internal/agentproto";
import "google/protobuf/struct.proto";

// Struct keeps optional capabilities forward compatible. All timestamps are RFC3339 UTC.
// Enroll request: {enrollment_token,name,region,carrier,version,protocol_version:1}
// response: {node_id,credential,protocol_version:1,heartbeat_seconds:15}
// Connect first frame: {type:"hello",node_id,credential,protocol_version:1,version}
// Client heartbeat: {type:"heartbeat",node_id,version,capabilities:["tcp","http"]}
// Client results: {type:"results",batch_id,results:[{id,task_id,candidate_id,
//   address,success,tcp_ms,tls_ms,ttfb_ms,download_bps,error,observed_at}]}
// Client ack: {type:"ack",task_id}; server ack: {type:"ack",batch_id}
// Server task: {type:"task",task:{id,candidate_id,address,mode,url,host,sni,
//   method,headers,expected_statuses:[200],expected_contains,timeout_ms,max_bytes,port}}
// Server config: {type:"config",heartbeat_seconds,max_batch_size,protocol_version}
// Server credential rotation: {type:"credential",credential}; client persists before ack.
// Tasks are replayed until results acknowledged. Every result id MUST equal
// lowercase hexadecimal SHA256(UTF8(node_id + ":" + task_id)); arbitrary UUIDs
// and rebinding one result to a different task are rejected. A committed result
// is counted once across replicas; node revocation serializes with ingestion.
service AgentService {
  rpc Enroll(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Connect(stream google.protobuf.Struct) returns (stream google.protobuf.Struct);
}
