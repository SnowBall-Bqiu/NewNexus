    "/nodes/{id}/redeploy": {
      "post": {
        "summary": "Issue a single-use redeployment token for the existing node identity",
        "description": "Requires explicit confirmation. Immediately revokes old credentials, pending credential rotation and existing sessions. Preserves node ID, administrator metadata, group membership and historical counters. Reissuing invalidates the previous unused token. Responses must not be cached.",
        "parameters": [
          { "name": "id", "in": "path", "required": true, "schema": { "type": "string" } },
          { "name": "X-CSRF-Token", "in": "header", "required": true, "schema": { "type": "string" }, "description": "CSRF token from the authenticated administrator session." }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["confirmed"],
                "properties": {
                  "confirmed": { "type": "boolean", "const": true },
                  "expires_in_seconds": { "type": "integer", "minimum": 60, "maximum": 900, "default": 900 }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "A single-use token, shown only in this response",
            "headers": { "Cache-Control": { "schema": { "type": "string", "const": "no-store" } } },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": ["token", "expires_at", "node_id", "name"],
                  "properties": {
                    "token": { "type": "string" },
                    "expires_at": { "type": "string", "format": "date-time" },
                    "node_id": { "type": "string" },
                    "name": { "type": "string" }
                  }
                }
              }
            }
          },
          "400": { "description": "Missing confirmation or invalid expiration", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "401": { "description": "Administrator authentication required", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "403": { "description": "CSRF validation failed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "404": { "description": "Node does not exist", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
          "409": { "description": "Node changed or redeployment unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
