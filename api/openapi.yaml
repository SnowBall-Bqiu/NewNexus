{
  "openapi": "3.1.0",
  "info": {
    "title": "NewNexus Control Plane",
    "version": "0.1.0",
    "description": "Single-administrator self-hosted DNS orchestration. External mutations are durable jobs; no provider operation is reported successful before verification."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    },
    {
      "apiKey": []
    }
  ],
  "paths": {
    "/nodes/installation": {
      "get": {
        "summary": "Get available Linux agent artifacts and the advertised gRPC gateway",
        "description": "Requires administrator authentication. Only artifacts present in the configured download directory are advertised; checksums are calculated from the current files.",
        "responses": {
          "200": {
            "description": "Installation metadata; artifacts may be an empty array",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/AgentInstallation" }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Error" }
              }
            }
          }
        }
      }
    },
    "/agent-ca.pem": {
      "get": {
        "summary": "Download the managed Agent CA certificate when self-signed TLS is enabled",
        "description": "Public certificate only. Does not expose the server leaf certificate or any private key. Returns 404 while disabled; responses always use Cache-Control: no-store.",
        "security": [],
        "responses": {
          "200": {
            "description": "CA certificate in PEM format",
            "headers": {
              "Cache-Control": { "schema": { "type": "string", "const": "no-store" } }
            },
            "content": {
              "application/x-pem-file": { "schema": { "type": "string", "format": "binary" } }
            }
          },
          "404": { "description": "Managed Agent self-signed TLS is disabled" },
          "405": { "description": "Only GET and HEAD are supported" },
          "503": { "description": "Agent TLS configuration or CA certificate is unavailable" }
        }
      },
      "head": {
        "summary": "Check availability of the managed Agent CA certificate",
        "security": [],
        "responses": {
          "200": {
            "description": "Certificate available; no response body",
            "headers": {
              "Cache-Control": { "schema": { "type": "string", "const": "no-store" } },
              "Content-Length": { "schema": { "type": "integer", "minimum": 1 } }
            }
          },
          "404": { "description": "Managed Agent self-signed TLS is disabled" },
          "503": { "description": "Agent TLS configuration or CA certificate is unavailable" }
        }
      }
    },
    "/agent-downloads/linux-{arch}": {
      "parameters": [
        {
          "name": "arch",
          "in": "path",
          "required": true,
          "schema": { "type": "string", "enum": ["amd64", "arm64"] }
        }
      ],
      "get": {
        "summary": "Download an agent binary without a console session",
        "description": "Serves only the fixed Linux amd64/arm64 artifact whitelist. No registration token or local filesystem path is exposed.",
        "security": [],
        "parameters": [
          {
            "name": "Range",
            "in": "header",
            "required": false,
            "schema": { "type": "string", "example": "bytes=0-1023" }
          }
        ],
        "responses": {
          "200": {
            "description": "Complete Linux agent binary",
            "content": {
              "application/octet-stream": {
                "schema": { "type": "string", "format": "binary" }
              }
            }
          },
          "206": {
            "description": "Requested byte range",
            "headers": {
              "Content-Range": { "schema": { "type": "string" } },
              "Accept-Ranges": { "schema": { "type": "string", "const": "bytes" } }
            },
            "content": {
              "application/octet-stream": {
                "schema": { "type": "string", "format": "binary" }
              }
            }
          },
          "404": { "description": "Architecture is unsupported or the binary is unavailable" },
          "405": { "description": "Only GET and HEAD are supported" },
          "416": { "description": "Requested byte range is not satisfiable" }
        }
      },
      "head": {
        "summary": "Check agent artifact availability and size",
        "security": [],
        "responses": {
          "200": {
            "description": "Artifact is available; no response body",
            "headers": {
              "Content-Length": { "schema": { "type": "integer", "minimum": 1 } },
              "Content-Type": { "schema": { "type": "string", "const": "application/octet-stream" } }
            }
          },
          "404": { "description": "Architecture is unsupported or the binary is unavailable" }
        }
      }
    },
