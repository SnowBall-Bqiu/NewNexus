  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "newnexus_session"
      },
      "apiKey": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "AgentArtifact": {
        "type": "object",
        "required": ["arch", "url", "sha256"],
        "properties": {
          "arch": { "type": "string", "enum": ["amd64", "arm64"] },
          "url": {
            "type": "string",
            "enum": ["/api/v1/agent-downloads/linux-amd64", "/api/v1/agent-downloads/linux-arm64"]
          },
          "sha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" }
        },
        "additionalProperties": false
      },
      "AgentTLSInfo": {
        "type": "object",
        "required": ["self_signed_enabled"],
        "properties": {
          "self_signed_enabled": { "type": "boolean" },
          "server_name": { "type": "string", "description": "Expected certificate name for NEWNEXUS_AGENT_TLS_SERVER_NAME" },
          "ca_url": { "type": "string", "const": "/api/v1/agent-ca.pem" },
          "ca_sha256": { "type": "string", "pattern": "^[a-f0-9]{64}$", "description": "SHA-256 of the downloadable PEM bytes" },
          "ca_fingerprint_sha256": { "type": "string", "pattern": "^[a-f0-9]{64}$", "description": "SHA-256 of the CA certificate DER bytes" },
          "not_after": { "type": "string", "format": "date-time" }
        },
        "description": "When disabled, contains only self_signed_enabled:false. Other fields appear only while enabled; no private key or leaf certificate is returned.",
        "additionalProperties": false
      },
      "AgentInstallation": {
        "type": "object",
        "required": ["server", "download_origin", "console_origin", "insecure_loopback", "tls", "artifacts"],
        "properties": {
          "server": {
            "type": "string",
            "description": "Effective gRPC host:port from addresses.agent_endpoint, then the public runtime endpoint. Empty for a wildcard listener without an explicit public address."
          },
          "download_origin": {
            "type": "string",
            "description": "Effective HTTP(S) API/artifact origin from addresses.api_origin, then NEWNEXUS_AGENT_DOWNLOAD_ORIGIN, normalized without a trailing slash. Empty when unconfigured; the console may use its current origin or a user-entered download origin. Independent of the gRPC server address; never inferred from request headers."
          },
          "console_origin": {
            "type": "string",
            "description": "Effective HTTP(S) console origin from addresses.console_origin, then NEWNEXUS_CONSOLE_ORIGIN. Empty when unconfigured, allowing the UI to use its current origin. Independent of API/downloads and gRPC."
          },
          "insecure_loopback": {
            "type": "boolean",
            "description": "True only for an explicitly allowed non-production plaintext listener whose exact literal loopback IP and port match server. A hostname or alternate local TLS proxy endpoint is never assumed to be plaintext."
          },
          "tls": { "$ref": "#/components/schemas/AgentTLSInfo" },
          "artifacts": {
            "type": "array",
            "maxItems": 2,
            "items": { "$ref": "#/components/schemas/AgentArtifact" }
          }
        },
        "additionalProperties": false
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      },
      "Project": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "name": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "status": {
            "type": "string"
          }
        }
      },
      "Site": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "project_id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "url": {
            "type": "string"
          },
          "probe_profile_id": {
            "type": "string"
          },
          "status": {
            "type": "string"
          }
        }
      },
      "Connection": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "name": {
            "type": "string"
          },
          "provider": {
            "type": "string",
            "enum": [
              "cloudflare",
              "dnspod",
              "alidns"
            ]
          },
          "purposes": {
            "type": "string"
          },
          "credentials": {
            "type": "object",
            "writeOnly": true
          },
          "credential_mask": {
            "type": "string",
            "readOnly": true
          },
          "capabilities": {
            "type": "object",
            "readOnly": true,
            "properties": {
              "lines": {
                "type": "boolean"
              },
              "weights": {
                "type": "boolean"
              },
              "apex": {
                "type": "boolean"
              },
              "saas": {
                "type": "boolean"
              },
              "custom_origin": {
                "type": "boolean"
              }
            }
          },
          "zone_capabilities": {
            "type": "object",
            "readOnly": true,
            "additionalProperties": {
              "type": "object",
              "properties": {
                "lines": {
                  "type": "boolean"
                },
                "weights": {
                  "type": "boolean"
                },
                "apex": {
                  "type": "boolean"
                },
                "saas": {
                  "type": "boolean"
                },
                "custom_origin": {
                  "type": "boolean"
                }
              }
            }
          },
          "status": {
            "type": "string",
            "readOnly": true
          },
          "status_message": {
            "type": "string",
            "readOnly": true
          },
          "last_validated_at": {
            "type": "string",
            "readOnly": true
          },
          "capability_errors": {
            "type": "object",
            "readOnly": true,
            "additionalProperties": {
              "type": "string"
            }
          },
          "zones": {
            "type": "array",
            "readOnly": true,
            "items": {
              "$ref": "#/components/schemas/Zone"
            }
          }
        }
      },
      "Source": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "project_id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "manual",
              "cloudflare",
              "url",
              "dns",
              "csv",
              "json"
            ]
          },
          "location": {
            "type": "string"
          },
          "enabled": {
            "type": "boolean"
          },
          "candidate_count": {
            "type": "integer"
          },
          "status": {
            "type": "string"
          },
          "last_synced_at": {
            "type": "string"
          }
        }
      },
      "Candidate": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "project_id": {
            "type": "string"
          },
          "source_id": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "family": {
            "type": "integer"
          },
          "tier": {
            "type": "string",
            "enum": [
              "inventory",
              "ranked",
              "active"
            ]
          },
          "healthy": {
            "type": "boolean",
            "readOnly": true
          },
          "score": {
            "type": "number",
            "readOnly": true
          },
          "success_rate": {
            "type": "number",
            "readOnly": true
          },
          "tcp_ms": {
            "type": "number",
            "readOnly": true
          },
          "tls_ms": {
            "type": "number",
            "readOnly": true
          },
          "ttfb_ms": {
            "type": "number",
            "readOnly": true
          },
          "p50_ms": {
            "type": "number",
            "readOnly": true
          },
          "p95_ms": {
            "type": "number",
            "readOnly": true
          },
          "download_bps": {
            "type": "number",
            "readOnly": true
          },
          "sample_count": {
            "type": "integer",
            "readOnly": true
          },
          "last_probed_at": {
            "type": "string",
            "readOnly": true
          },
          "aggregate_pending": {
            "type": "boolean",
            "readOnly": true,
            "description": "Recent reports are durable; complete recent-history score is being recomputed by the aggregation worker."
          }
        }
      },
      "Node": {
